enableScripts: false
nmHoistingLimits: workspaces
nodeLinker: node-modules

# Desktop dependencies are consumed one day after publication at the earliest: a release that is
# still warm cannot be adopted by an unattended install, while a reviewed pin keeps working.
npmMinimalAgeGate: 1440

# macOS releases are universal, so the physical node_modules tree must contain
# both Darwin CPU variants before Electron Builder assembles the two slices.
supportedArchitectures:
  os:
    - current
  cpu:
    - current
    - x64
    - arm64
