# A private, ephemeral loopback port allows Next to coexist with other editions.
- id: webserver
  disabled: true
- insert:
    - id: nonead-dsh-desktop-webserver
      # Relative to this patch file: the loader rewrites it to a file URL, so the
      # webserver bundle resolves from the installer (app.asar) as well as a checkout.
      name: ./lib/webserver.js
      inject: [webStartup]
      config:
        host: 127.0.0.1
        port: 0
