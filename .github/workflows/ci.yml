name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  # Keep required checks conclusive for documentation-only changes. Workflow
  # path filters can leave required checks pending, so classify inside the run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.scope.outputs.product }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # GitHub's pull-request merge ref can retain the base branch's
          # submodule gitlink when the PR advances it to a descendant. Check
          # out the actual PR head so pinned submodules match upstream.json.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A pull request must not be able to relax its own gate. Run the documentation,
          # market-direction and classifier scripts from the base commit instead of the
          # checked-out head; the documents they validate still come from the working tree.
          # The base copies replace `scripts/` rather than living in a sibling directory
          # because both gates resolve the repository root as `import.meta.dirname/..`
          # (scripts/verify-bilingual-docs.mjs, scripts/verify-market-dependency-direction.mjs),
          # so only the canonical path keeps them reading the working-tree documents.
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "::warning::No base commit for $EVENT_NAME; classifying with the pull request's own gate scripts."
          elif git checkout "$BASE_SHA" -- scripts; then
            echo "Gates run from base commit $BASE_SHA; documents come from the working tree."
          else
            echo "::warning::Could not restore scripts/ from $BASE_SHA; classifying with the pull request's own gate scripts."
          fi
          node --test scripts/bilingual-docs.test.mjs
          node scripts/verify-bilingual-docs.mjs
          node --test scripts/market-dependency-direction.test.mjs
          node scripts/verify-market-dependency-direction.mjs
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            product=true
          else
            git diff --check "$BASE_SHA" "$HEAD_SHA"
            product="$(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" | node scripts/classify-ci-changes.mjs)"
          fi
          echo "product=$product" >> "$GITHUB_OUTPUT"

  # Product gate: AA profile smoke is temporarily paused below.
  # A documentation-only change already passed diff validation in `changes`.
  check:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only gate
        if: needs.changes.outputs.product == 'false'
        run: echo "Documentation-only change; product build and tests are not required."
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: needs.changes.outputs.product == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: needs.changes.outputs.product == 'true'
        with:
          node-version: 22.23.2
      - if: needs.changes.outputs.product == 'true'
        run: corepack enable
      - name: Resolve Yarn cache folder
        if: needs.changes.outputs.product == 'true'
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: needs.changes.outputs.product == 'true'
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - if: needs.changes.outputs.product == 'true'
        run: yarn install --immutable
      # The AA profile smoke is paused upstream (its Host service activation is
      # not fixed yet), so CI runs the explicit `check:ci` chain instead of
      # rewriting `dsh-plugin-desktop-beta/package.json` at run time. `check`
      # itself still runs `verify:aa`, so a local run stays reproducible.
      - if: needs.changes.outputs.product == 'true'
        run: yarn run check:ci
      - name: Install Chromium for Next window regression
        if: needs.changes.outputs.product == 'true'
        run: yarn workspace nonead-dsh-desktop exec playwright install --with-deps chromium
      - name: Verify Next window controls in the official frontend
        if: needs.changes.outputs.product == 'true'
        run: yarn workspace nonead-dsh-desktop verify:window-controls
      - name: Verify Next Profile onboarding without a Host
        if: needs.changes.outputs.product == 'true'
        run: yarn workspace nonead-dsh-desktop verify:onboarding
      - name: Verify Next native protocol mutations in Electron
        if: needs.changes.outputs.product == 'true'
        run: xvfb-run --auto-servernum yarn workspace nonead-dsh-desktop verify:protocol --no-sandbox
      - name: Verify Next native sidebar Browser in Electron
        if: needs.changes.outputs.product == 'true'
        run: xvfb-run --auto-servernum yarn workspace nonead-dsh-desktop verify:sidebar-browser --no-sandbox

  # Windows-only logic and unsigned NSIS/portable builds on a real Windows runner:
  # updates, window options, pwsh sandbox, volume diagnostics, and packaging.
  # The package gate runs once; both artifacts reuse its build output.
  desktop-windows:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [dsh-plugin-desktop-beta]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$env:GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      # Typecheck is platform-neutral and already gated by `check`.
      - run: yarn workspace ${{ matrix.workspace }} check:win-package:platform
      - name: Build Windows installer
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          # CI artifacts are never published; skipping compression saves minutes.
          DSH_WINDOWS_PACKAGE_COMPRESSION: store
        run: yarn workspace ${{ matrix.workspace }} dist:win
      - name: Build Windows portable archive
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          DSH_WINDOWS_PACKAGE_COMPRESSION: store
        run: yarn workspace ${{ matrix.workspace }} dist:win-portable

  # The Stable shell assembles its payload through a different workspace and had
  # no packaging coverage at all. Build the unpacked directory instead of an
  # installer: that still runs prepare-payload, the beforeBuild/beforePack payload
  # checks, the asarUnpack layout, afterPack verify-packaged and the fuse check,
  # without paying for NSIS compression. `package:dir:stable` reuses the release
  # preparation the manual Windows release runs.
  desktop-windows-stable:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$env:GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - name: Build the Stable unpacked application
        run: yarn package:dir:stable

  # macOS-only universal packaging smoke on a real macOS runner: the signed
  # release is built manually on a credentialed machine, so an unsigned DMG
  # here catches Intel and Apple Silicon packaging regressions before a manual
  # release. No signing secrets ever reach this job.
  # Linux x64 distribution artifacts: unsigned AppImage and Debian package
  # built on a stock ubuntu runner, mirroring the Windows packaging job.
  desktop-linux:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        workspace: [dsh-plugin-desktop-beta]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - run: yarn workspace ${{ matrix.workspace }} check:linux-package:platform
      - name: Build Linux AppImage and Debian package
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace ${{ matrix.workspace }} dist:linux

  desktop-macos:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        workspace: [dsh-plugin-desktop-beta]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - run: yarn workspace ${{ matrix.workspace }} check:mac-package:platform
      - name: Build macOS smoke artifact
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          # The universal merge alone takes 9-17 minutes, so pull requests
          # package only the runner's native arm64 app. Pushes to main and
          # manual runs keep the full universal DMG.
          DSH_MAC_SMOKE_ARCH: ${{ github.event_name == 'pull_request' && 'arm64' || 'universal' }}
        run: yarn workspace ${{ matrix.workspace }} dist:mac-smoke

  # Upstream toolchain smoke: the portable-shell scripts must resolve the
  # pinned submodule's own Yarn/pnpm release on Windows.
  upstream-command-windows:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - run: yarn check:layout
      - run: yarn upstream:version
